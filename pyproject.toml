[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opendemand-engine"
version = "0.0.1"
description = "OpenDemand Python forecasting sidecar (Milestone 1 Naive engine)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "statsforecast==2.1.1",
    "polars==2.0.0",
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = ["pyinstaller>=6.11"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["opendemand_engine"]
