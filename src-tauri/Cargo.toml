[package]
name = "opendemand"
version = "0.0.1"
description = "Local-first demand forecasting desktop application"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/filki/opendemand"

[lib]
name = "opendemand_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "opendemand"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-specta", "dep:tauri-plugin-dialog", "dep:specta-typescript"]

[build-dependencies]
tauri-build = { version = "2.7.2", optional = true , features = [] }

[dependencies]
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = { version = "0.0.12", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2.12.3", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }
