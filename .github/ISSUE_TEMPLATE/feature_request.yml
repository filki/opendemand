name: Feature request
description: Propose a change or a new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        OpenDemand is in Milestone 1 (canonical CSV → SQLite → Naive forecast → Rust persistence → chart). Features outside that scope are welcome as proposals, but they wait until the milestone works end-to-end — see the scope rules in `AGENTS.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: fits
    attributes:
      label: How it fits
      description: Which part of the approved stack or docs does this touch? Note any ADR it would change — decisions change by superseding ADRs, not by editing accepted ones.
    validations:
      required: false