name: Sidecar Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidecar-diagnosis
  cancel-in-progress: false

jobs:
  reader-variants:
    name: Windows stdin reader variants
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe stdin reader mechanisms
        shell: pwsh
        run: python packaging/probe_stdin_reader_variants.py

  windows-stdio:
    name: Windows frozen sidecar stdio
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-windows-latest
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Build the standalone Python sidecar
        run: uv run --frozen python packaging/build_sidecar.py
      - name: Probe the frozen sidecar over subprocess pipes
        run: uv run --frozen python packaging/diagnose_sidecar_stdio.py --engine packaging/sidecar-dist/opendemand-engine/opendemand-engine.exe
      - name: Probe the source interpreter over subprocess pipes
        run: uv run --frozen python packaging/diagnose_sidecar_stdio.py --engine-module
      - name: Probe the tokio pipe path
        env:
          OPENDEMAND_ENGINE: ${{ github.workspace }}/packaging/sidecar-dist/opendemand-engine/opendemand-engine.exe
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test engine_stdio -- --nocapture
