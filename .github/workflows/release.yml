name: Release

# Dispatch only: publishing the draft creates the tag, and a tag trigger would
# rebuild against an already published release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release
    uses: ./.github/workflows/ci.yml

  release:
    name: Package ${{ matrix.platform }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen
      - name: Build the standalone Python sidecar
        run: uv run --frozen python packaging/build_sidecar.py
      - name: Verify bundled forecasts and Rust persistence
        env:
          OPENDEMAND_ENGINE: ${{ github.workspace }}/packaging/sidecar-dist/opendemand-engine/opendemand-engine${{ runner.os == 'Windows' && '.exe' || '' }}
          OPENDEMAND_JOB_TIMEOUT_SECONDS: "600"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test milestone -- --nocapture
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenDemand v__VERSION__"
          releaseBody: |
            Unsigned development preview of OpenDemand v__VERSION__.

            What works: a home screen that opens a module and a workspace of your
            choice, with a workspace list, create/open in any folder, and a way back
            home at any time; canonical CSV import plus a guided import that converts
            raw SAP, Subiekt, Comarch, and Excel (.xlsx) exports into the same weekly
            observations, with column mapping, preview, validation, and saved
            configurations; a weekly update that reuses the saved configuration,
            forecasts a committed import automatically, and compares the newest run
            with the previous import revision (demand changes and baseline forecast
            deltas per product, aligned by calendar week); Naive, SeasonalNaive(52)
            and AutoETS(52) forecasts with automatic per-series model selection and
            optional filling of missing weeks in the forecast input only (last known
            value, same week last year, or mean of the last four known weeks), so
            gaps no longer block seasonal models while stored history and exports
            stay untouched; run-scoped manual overrides; baseline/effective forecast
            charts; and full-run CSV export. Model fitting runs on all available CPU
            cores, so long forecast runs finish several times faster than in the
            previous version.

            An older workspace is upgraded behind a verified pre-migration backup;
            backups live in the workspace's `backups/` directory.

            The installers are not code-signed. macOS shows a Gatekeeper warning until
            notarization, and Windows SmartScreen can warn about an unknown publisher.
            See the README for scope and known limitations.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }} -- --locked

  finalize:
    name: Align Draft Commit
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Match the draft to the verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            printf 'Refusing to retarget a published release.\n' >&2
            exit 1
          fi
          gh release edit "$tag" --target "$(git rev-parse HEAD)"
