name: Release

# Dispatch only: publishing the draft creates the tag, and a tag trigger would
# rebuild against an already published release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release
    uses: ./.github/workflows/ci.yml

  release:
    name: Package ${{ matrix.platform }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen
      - name: Build the standalone Python sidecar
        run: uv run --frozen python packaging/build_sidecar.py
      - name: Verify bundled forecasts and Rust persistence
        env:
          OPENDEMAND_ENGINE: ${{ github.workspace }}/packaging/sidecar-dist/opendemand-engine/opendemand-engine${{ runner.os == 'Windows' && '.exe' || '' }}
          OPENDEMAND_JOB_TIMEOUT_SECONDS: "600"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --test milestone -- --nocapture
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenDemand v__VERSION__"
          releaseBody: |
            Unsigned development preview of OpenDemand v__VERSION__.

            What works: canonical CSV import, Naive forecast through the bundled
            Python sidecar, run-scoped manual overrides, baseline/effective
            forecast charts, and full-run CSV export. See the README for scope
            and known limitations.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.bundle.conf.json ${{ matrix.args }} -- --locked

  finalize:
    name: Align Draft Commit
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match the draft to the verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]; then
            printf 'Refusing to retarget a published release.\n' >&2
            exit 1
          fi
          gh release edit "$tag" --target "$(git rev-parse HEAD)"
